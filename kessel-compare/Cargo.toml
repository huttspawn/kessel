[package]
name = "kessel-compare"
version = "0.1.0"
edition = "2021"
description = "Cross-patch diff for kessel spice databases -- the SWTOR patch changelog, keyed on kessel's stable_id (game_id shifts every patch)."

# Excluded from the kessel workspace (see root Cargo.toml [workspace.exclude]).
# Build it standalone:
#   cd kessel-compare && cargo build --release

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
