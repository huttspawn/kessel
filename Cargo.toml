[workspace]
members = ["kessel", "kessel-discovery"]
default-members = ["kessel"]
# kessel-compare is a standalone local tooling crate (patch-changelog diff) with a
# sibling-repo path dep on smugglr-core. Excluded so it never enters the kessel
# crate's build or CI; build it on demand from its own directory.
exclude = ["kessel-compare"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

# Lint policy. The production `kessel` crate opts in (`[lints] workspace = true`);
# the build-on-demand `kessel-discovery` examples are intentionally exempt.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
# Shared deps; both crates inherit via `dep = { workspace = true }`
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.31"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.4", features = ["derive"] }
flate2 = "1.0"
zstd = "0.13"
zstd-safe = "7.2"
toml = "0.8"
regex = "1.10"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2.9"
indicatif = "0.17"
rayon = "1.8"
image = { version = "0.25", features = ["webp"] }
image_dds = "0.4"

# Acceptance scenarios (BDD). Dev-only: the runner never ships in the binary.
rstest = "0.26"
rstest-bdd = "0.6"
rstest-bdd-macros = "0.6"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
