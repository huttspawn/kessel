[workspace]
members = ["kessel-bytes", "kessel-tor", "kessel-gom", "kessel-text", "kessel-model", "kessel-media", "kessel"]
default-members = ["kessel"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# no panic reachable from game bytes
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# pedantic lints that fight the domain's own vocabulary
module_name_repetitions = "allow"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
flate2 = "1.0"
zstd = "0.13"
kessel-bytes = { path = "kessel-bytes" }
kessel-tor = { path = "kessel-tor" }
kessel-gom = { path = "kessel-gom" }
kessel-text = { path = "kessel-text" }
kessel-model = { path = "kessel-model" }
kessel-media = { path = "kessel-media" }
