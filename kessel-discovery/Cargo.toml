[package]
name = "kessel-discovery"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Discovery and reverse-engineering tooling for kessel. Build-on-demand examples; run with `cargo run -p kessel-discovery --example <name>`."
publish = false

# Discovery tools live in examples/ -- built on demand (cargo run --example <name>),
# so the default workspace build stays cheap. Keepers: the verify_* oracles.

[dependencies]
kessel = { path = "../kessel" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
regex.workspace = true
flate2.workspace = true
zstd.workspace = true
clap.workspace = true
hex.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
indicatif.workspace = true
image_dds.workspace = true
